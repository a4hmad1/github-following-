name: 🚀 Developer Auto-Pilot (Cloud 24/7)

on:
  schedule:
    # Runs every 30 minutes in GitHub cloud
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of developers to follow per batch'
        required: false
        default: '250'
      target:
        description: 'Target developer scope (global, backend, software-engineer, software-developer, kurdish, all)'
        required: false
        default: 'global'
      role:
        description: 'Role filter (all, software-engineer, software-developer, backend)'
        required: false
        default: 'all'
      gender:
        description: 'Gender filter (all, female, male)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 🚀 Run Developer Auto-Pilot Batch
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 autofollow.py --once \
            --batch-size ${{ github.event.inputs.batch_size || 250 }} \
            --target ${{ github.event.inputs.target || 'global' }} \
            --role ${{ github.event.inputs.role || 'all' }} \
            --gender ${{ github.event.inputs.gender || 'all' }}

      - name: 💾 Commit & Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f followed_history.json page_cursor.json follows.log daily_state.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore(autopilot): sync follow history [skip ci]" && git push)
